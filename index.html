<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Clothing Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 25px 10px;
        }

        h1 {
            margin: 0;
        }

        .hero {
            padding: 60px 20px;
            background: white;
        }

        .hero h2 {
            font-size: 32px;
        }

        .button {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 14px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            margin-top: 15px;
        }

        .categories {
            padding: 30px 15px;
        }

        .category {
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 8px;
            width: 120px;
            border-radius: 8px;
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>MY CLOTHING STORE</h1>
        <p>Fashion for Everyone</p>
    </header>

    <section class="hero">
        <h2>Welcome to Our Store</h2>

        <p>
            Discover beautiful clothing for Girls, Kids and Women.
        </p>

        <a class="button"
           href="https://wa.me/919999999999">
            Order on WhatsApp
        </a>
    </section>

    <section class="categories">

        <h2>Shop By Category</h2>

        <div class="category">
            👧<br>
            Girls
        </div>

        <div class="category">
            🧒<br>
            Kids
        </div>

        <div class="category">
            👩<br>
            Women
        </div>

        <div class="category">
            👗<br>
            Ethnic Wear
        </div>

    </section>

    <footer>
        © 2026 My Clothing Store
    </footer>

</body>
</html>
